[package]
name = "svg-conversion-wasm"
version = "1.0.0"
edition = "2024"
description = "SVG color conversion for browser Web Workers"
license = "ISC"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
csscolorparser = "0.7"
wasm-bindgen = "0.2"
xmltree = "0.12"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true

[package.metadata.wasm-pack.profile.release]
# wasm-pack 0.15 bundles an older Binaryen that cannot validate instructions
# emitted by current Rust. The Rust release profile still performs LTO/size opts.
wasm-opt = false

[workspace]
members = ["demo"]
