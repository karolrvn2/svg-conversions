[package]
name = "svg-conversion-demo"
version = "1.0.0"
edition = "2024"
publish = false

[dependencies]
gloo-timers = "0.3"
gloo-net = "0.6"
js-sys = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde-wasm-bindgen = "0.6"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
yew = { version = "0.21", features = ["csr"] }

[dependencies.web-sys]
version = "0.3"
features = ["Event", "HtmlInputElement", "HtmlTextAreaElement", "MessageEvent", "Navigator", "Performance", "Window", "Worker", "WorkerOptions", "WorkerType"]
